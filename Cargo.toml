[package]
name = "cargo-tar"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
authors = ["Ulyssa <git@ulyssa.dev>"]
repository = "https://github.com/ulyssa/cargo-tar"
description = "Build release tarballs from a Cargo project"
categories = ["command-line-utilities", "development-tools::cargo-plugins", "development-tools::build-utils"]
keywords = ["tar", "tarball", "cargo-subcommand"]
exclude = [".github", "CONTRIBUTING.md"]
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
glob = "0.3.4"
humansize = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"

[dependencies.flate2]
version = "1.1.10"
default-features = false
features = ["zlib-rs"]
